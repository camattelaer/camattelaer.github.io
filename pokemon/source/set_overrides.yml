# Manual set matches for when build_catalogue.py can't find a set automatically.
# Key: set_name exactly as in the xlsx. Values (both optional):
#   tcgplayer: TCGplayer groupId  (see https://tcgcsv.com/tcgplayer/3/groups)
#   tcgdex:    TCGdex set id      (see https://api.tcgdex.net/v2/en/sets)
#   logo:      image URL          used instead of the TCGdex / pokemontcg.io logo
#   cardtrader: expansion id      CardTrader expansion for master set prices / wishlists, when the
#                                 automatic name match picks the wrong one or none
#   order:     [printed numbers]  card order on the site and in placeholder PDFs, e.g. a
#                                 Classic Collection booklet's; unlisted cards go last
#   tcgplayer_extra: [groupIds]   subset groups to merge in; replaces the automatic
#                                 Trainer Gallery / Galarian Gallery / Shiny Vault /
#                                 Radiant Collection detection ([] turns it off)

